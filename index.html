<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>割引計算ツール</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #ffffff;
      --surface-strong: #eef7f3;
      --text: #17201b;
      --muted: #68736e;
      --line: #dce4df;
      --accent: #0f8f68;
      --accent-dark: #086447;
      --warn: #b24b00;
      --shadow: 0 18px 45px rgba(20, 38, 30, 0.11);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(15, 143, 104, 0.12), transparent 34%),
        linear-gradient(315deg, rgba(28, 91, 122, 0.10), transparent 32%),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 44px;
    }

    .app-header {
      display: grid;
      gap: 10px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      max-width: 820px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(300px, 410px) 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel,
    .result-panel {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 22px;
      position: sticky;
      top: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
    }

    label,
    .group-label {
      font-weight: 700;
      font-size: 14px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      min-height: 48px;
      border: 0;
      padding: 10px 14px;
      font: inherit;
      font-size: 18px;
      background: transparent;
      color: var(--text);
      outline: none;
    }

    select {
      appearance: none;
      cursor: pointer;
    }

    .select-row {
      position: relative;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
    }

    .select-row::after {
      content: "";
      position: absolute;
      right: 16px;
      top: 50%;
      width: 9px;
      height: 9px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }

    input[type="number"] {
      appearance: textfield;
    }

    .suffix {
      min-width: 48px;
      padding: 0 14px;
      color: var(--muted);
      font-weight: 700;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .controls {
      display: grid;
      gap: 14px;
      margin: 18px 0;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
    }

    .segmented input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .segmented label {
      min-height: 42px;
      display: grid;
      place-items: center;
      border-right: 1px solid var(--line);
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      transition: 0.16s ease;
    }

    .segmented label:last-child {
      border-right: 0;
    }

    .segmented input:checked + label {
      background: var(--accent);
      color: white;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .primary {
      color: white;
      background: var(--accent);
      box-shadow: 0 10px 24px rgba(15, 143, 104, 0.25);
    }

    .primary:hover {
      background: var(--accent-dark);
    }

    .ghost {
      color: var(--text);
      background: #eef2f0;
      border: 1px solid var(--line);
    }

    .register {
      margin-top: 20px;
      padding: 18px;
      border-radius: 8px;
      background: var(--surface-strong);
      border: 1px solid #cde5da;
    }

    .register-title,
    .register-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .register-title {
      margin-bottom: 12px;
    }

    .register-line {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #cde5da;
    }

    .register-value {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 8px;
      min-height: 60px;
      color: var(--accent-dark);
    }

    .yen {
      font-size: 22px;
      font-weight: 900;
    }

    #customResult {
      font-size: clamp(36px, 7vw, 54px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }

    .message {
      min-height: 22px;
      margin-top: 12px;
      color: var(--warn);
      font-size: 13px;
      font-weight: 700;
    }

    .result-panel {
      overflow: hidden;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 20px 22px;
      background: #13241d;
      color: white;
    }

    .summary p {
      margin: 0;
      color: rgba(255, 255, 255, 0.74);
      line-height: 1.5;
    }

    .summary strong {
      display: block;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
    }

    th,
    td {
      padding: 15px 18px;
      text-align: right;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      color: var(--muted);
      font-size: 13px;
      background: #f8faf9;
    }

    tbody tr {
      cursor: pointer;
    }

    tbody tr:hover,
    tbody tr.selected {
      background: #f4fbf8;
    }

    tbody tr.selected .discount-label {
      color: white;
      background: var(--accent);
    }

    .discount-label {
      display: inline-flex;
      min-width: 78px;
      justify-content: center;
      padding: 5px 9px;
      border-radius: 999px;
      color: var(--accent-dark);
      background: #e0f3eb;
      font-weight: 800;
    }

    .price {
      font-size: 18px;
      font-weight: 900;
    }

    .empty {
      padding: 44px 22px;
      text-align: center;
      color: var(--muted);
      line-height: 1.8;
    }

    @media (max-width: 800px) {
      main {
        width: min(100% - 20px, 620px);
        padding: 22px 0 28px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .panel {
        position: static;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .button-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="app-header">
      <h1>割引計算ツール</h1>
      <p class="lead">元値から1割引〜9割引までの価格を一覧表示します。店頭で「○割引」と表示された金額から、レジでさらに「○% OFF」になる場合の最終金額も計算できます。</p>
    </header>

    <section class="layout" aria-label="割引計算アプリ">
      <form class="panel" id="calculatorForm">
        <div class="field">
          <label for="originalPrice">元値</label>
          <div class="input-row">
            <input id="originalPrice" type="text" inputmode="decimal" autocomplete="off" placeholder="例: 5980">
            <span class="suffix">円</span>
          </div>
          <p class="hint">カンマ付き入力にも対応しています。</p>
        </div>

        <div class="field">
          <label for="baseDiscount">店頭表示の割引</label>
          <div class="select-row">
            <select id="baseDiscount">
              <option value="10">1割引</option>
              <option value="20">2割引</option>
              <option value="30" selected>3割引</option>
              <option value="40">4割引</option>
              <option value="50">5割引</option>
              <option value="60">6割引</option>
              <option value="70">7割引</option>
              <option value="80">8割引</option>
              <option value="90">9割引</option>
            </select>
          </div>
          <p class="hint">右の一覧の行を押しても選択できます。</p>
        </div>

        <div class="field">
          <label for="customDiscount">レジでさらに引かれる割引率</label>
          <div class="input-row">
            <input id="customDiscount" type="number" inputmode="decimal" min="0" max="100" step="0.1" placeholder="例: 35">
            <span class="suffix">%OFF</span>
          </div>
        </div>

        <div class="controls">
          <div>
            <div class="group-label">端数処理</div>
            <div class="segmented" role="radiogroup" aria-label="端数処理">
              <input type="radio" id="roundFloor" name="rounding" value="floor" checked>
              <label for="roundFloor">切り捨て</label>
              <input type="radio" id="roundRound" name="rounding" value="round">
              <label for="roundRound">四捨五入</label>
              <input type="radio" id="roundCeil" name="rounding" value="ceil">
              <label for="roundCeil">切り上げ</label>
            </div>
          </div>

          <div class="button-row">
            <button class="primary" type="submit">割引を計算</button>
            <button class="ghost" type="button" id="clearButton">クリア</button>
          </div>
        </div>

        <div class="register" aria-live="polite">
          <div class="register-title">
            <span>最終レジ表示金額</span>
            <span id="customLabel">3割引 + 0% OFF</span>
          </div>
          <div class="register-value">
            <span class="yen">¥</span>
            <span id="customResult">0</span>
          </div>
          <div class="register-line">
            <span>店頭表示価格</span>
            <span id="basePriceResult">¥0</span>
          </div>
          <div class="message" id="message"></div>
        </div>
      </form>

      <section class="result-panel">
        <div class="summary">
          <div>
            <strong id="summaryPrice">元値 ¥0</strong>
            <p id="summaryText">元値を入力して「割引を計算」を押してください。</p>
          </div>
          <button class="ghost" type="button" id="sampleButton">サンプル入力</button>
        </div>
        <div class="table-wrap" id="resultArea">
          <div class="empty">1割引から9割引までの価格一覧がここに表示されます。</div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const form = document.querySelector("#calculatorForm");
    const originalPriceInput = document.querySelector("#originalPrice");
    const baseDiscountSelect = document.querySelector("#baseDiscount");
    const customDiscountInput = document.querySelector("#customDiscount");
    const customResult = document.querySelector("#customResult");
    const customLabel = document.querySelector("#customLabel");
    const basePriceResult = document.querySelector("#basePriceResult");
    const message = document.querySelector("#message");
    const resultArea = document.querySelector("#resultArea");
    const summaryPrice = document.querySelector("#summaryPrice");
    const summaryText = document.querySelector("#summaryText");
    const clearButton = document.querySelector("#clearButton");
    const sampleButton = document.querySelector("#sampleButton");

    const yenFormatter = new Intl.NumberFormat("ja-JP");

    function parsePrice(value) {
      const normalized = String(value).replace(/[,\s￥¥円]/g, "");
      const number = Number(normalized);
      return Number.isFinite(number) ? number : NaN;
    }

    function selectedRounding() {
      return document.querySelector('input[name="rounding"]:checked').value;
    }

    function applyRounding(value) {
      const mode = selectedRounding();
      if (mode === "round") return Math.round(value);
      if (mode === "ceil") return Math.ceil(value);
      return Math.floor(value);
    }

    function calculateDiscountedPrice(price, percentOff) {
      return applyRounding(price * (100 - percentOff) / 100);
    }

    function formatYen(value) {
      return yenFormatter.format(Math.max(0, value));
    }

    function validate(price, customPercent) {
      if (!Number.isFinite(price) || price < 0) {
        return "元値を0円以上の数字で入力してください。";
      }
      if (customDiscountInput.value !== "" && (!Number.isFinite(customPercent) || customPercent < 0 || customPercent > 100)) {
        return "レジの追加割引率は0〜100の範囲で入力してください。";
      }
      return "";
    }

    function selectedWariLabel() {
      return `${Number(baseDiscountSelect.value) / 10}割引`;
    }

    function customPercentValue() {
      return customDiscountInput.value === "" ? 0 : Number(customDiscountInput.value);
    }

    function renderTable(price, customPercent) {
      const selectedPercent = Number(baseDiscountSelect.value);
      const rows = Array.from({ length: 9 }, (_, index) => {
        const wari = index + 1;
        const percent = wari * 10;
        const displayed = calculateDiscountedPrice(price, percent);
        const finalPrice = calculateDiscountedPrice(displayed, customPercent);
        const saved = applyRounding(price - finalPrice);
        const selectedClass = percent === selectedPercent ? " class=\"selected\"" : "";

        return `
          <tr${selectedClass} data-percent="${percent}" tabindex="0" aria-label="${wari}割引を選択">
            <td><span class="discount-label">${wari}割引</span></td>
            <td>${percent}% OFF</td>
            <td class="price">¥${formatYen(displayed)}</td>
            <td class="price">¥${formatYen(finalPrice)}</td>
            <td>¥${formatYen(saved)}</td>
          </tr>
        `;
      }).join("");

      resultArea.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>店頭表示</th>
              <th>割引率</th>
              <th>表示価格</th>
              <th>追加後</th>
              <th>合計お得額</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function calculate() {
      const price = parsePrice(originalPriceInput.value);
      const customPercent = customPercentValue();
      const error = validate(price, customPercent);

      if (error) {
        message.textContent = error;
        return;
      }

      const basePercent = Number(baseDiscountSelect.value);
      const displayedPrice = calculateDiscountedPrice(price, basePercent);
      const registerPrice = calculateDiscountedPrice(displayedPrice, customPercent);

      message.textContent = "";
      renderTable(price, customPercent);
      customResult.textContent = formatYen(registerPrice);
      basePriceResult.textContent = `¥${formatYen(displayedPrice)}`;
      customLabel.textContent = `${selectedWariLabel()} + ${customPercent || 0}% OFF`;
      summaryPrice.textContent = `元値 ¥${formatYen(price)}`;
      summaryText.textContent = `店頭表示価格からレジ割引を追加し、${selectedRoundingLabel()}で計算しています。`;
    }

    function selectedRoundingLabel() {
      const mode = selectedRounding();
      if (mode === "round") return "1円未満を四捨五入";
      if (mode === "ceil") return "1円未満を切り上げ";
      return "1円未満を切り捨て";
    }

    function clearAll() {
      originalPriceInput.value = "";
      baseDiscountSelect.value = "30";
      customDiscountInput.value = "";
      customResult.textContent = "0";
      customLabel.textContent = "3割引 + 0% OFF";
      basePriceResult.textContent = "¥0";
      summaryPrice.textContent = "元値 ¥0";
      summaryText.textContent = "元値を入力して「割引を計算」を押してください。";
      message.textContent = "";
      resultArea.innerHTML = '<div class="empty">1割引から9割引までの価格一覧がここに表示されます。</div>';
      originalPriceInput.focus();
    }

    function calculateIfReady() {
      if (originalPriceInput.value.trim()) calculate();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      calculate();
    });

    clearButton.addEventListener("click", clearAll);

    sampleButton.addEventListener("click", () => {
      originalPriceInput.value = "5,980";
      baseDiscountSelect.value = "30";
      customDiscountInput.value = "35";
      calculate();
    });

    baseDiscountSelect.addEventListener("change", calculateIfReady);
    customDiscountInput.addEventListener("input", calculateIfReady);

    resultArea.addEventListener("click", (event) => {
      const row = event.target.closest("tr[data-percent]");
      if (!row) return;
      baseDiscountSelect.value = row.dataset.percent;
      calculateIfReady();
    });

    resultArea.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const row = event.target.closest("tr[data-percent]");
      if (!row) return;
      event.preventDefault();
      baseDiscountSelect.value = row.dataset.percent;
      calculateIfReady();
    });

    document.querySelectorAll('input[name="rounding"]').forEach((input) => {
      input.addEventListener("change", calculateIfReady);
    });
  </script>
</body>
</html>
